{% extends 'form.html' %}
{% block l_r %}Register form{% endblock %}
{% block form_fields %}
    <div class="form-group mb-3">
        <label for="username-input" class="form-label">Username</label>
        <input type="text" class="form-control" id="username-input" name="username" placeholder="Username..." required>
    </div>
    <div class="form-group mb-3">
        <label for="password-input" class="form-label">Password</label>
        <input type="password" class="form-control" id="password-input" name="password" placeholder="Password..." required minlength="8">
    </div>
{% endblock %}
{% block xtralnk %}<a href="{{ url_for('login') }}" class="card-link">Already have an account</a>{% endblock %}
